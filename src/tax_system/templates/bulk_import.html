{% extends "base.html" %}
{% block title %}まとめて取込{% endblock %}
{% block content %}
<h1>複数ファイルをまとめて取込</h1>
<p class="lead">
  古物台帳・POS取引データ・本人確認データ・期末在庫表・輸出データ・相対表を、種類の指定なしでまとめて取り込みます。<br>
  ファイルごとに列構成から種類を自動判定します。判別できないファイルはスキップされ、理由が表示されます。
</p>

<form class="card" method="post" enctype="multipart/form-data">
  <label>ファイル（複数選択可）
    <input type="file" name="files" accept=".xlsx,.csv" multiple required>
  </label>
  <button type="submit" class="button">まとめて取り込む</button>
</form>

<p class="muted"><a href="{{ url_for('new_import') }}">← 種類を指定して1件ずつ取り込む場合はこちら</a></p>
{% endblock %}
