{% extends "base.html" %}
{% block title %}データ取込{% endblock %}
{% block content %}
<h1>データの取込</h1>
<p class="lead">古物台帳CSV・相対表Excel・期末在庫表CSVを取り込みます。取込後は自動でチェック結果画面に進みます。</p>

<form class="card" method="post" enctype="multipart/form-data">
  <label>種類
    <select name="report_type" required>
      <option value="ledger">古物台帳（CSV）</option>
      <option value="comparison">相対表（Excel）</option>
      <option value="inventory">期末在庫表（CSV・商品名/仕入れ原価/在庫数）</option>
    </select>
  </label>

  <label>ファイル
    <input type="file" name="file" accept=".xlsx,.csv" required>
  </label>

  <button type="submit" class="button">取り込む</button>
</form>
{% endblock %}
